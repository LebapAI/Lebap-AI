name: Run backend tests

# Keep each commit's result available instead of cancelling it on a later push.
# Main is the canonical branch; short-lived branches are validated through pull requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - "server/**/*.js"
      - "server/prisma/**"
      - "collector/**/*.js"
      - ".github/workflows/run-tests.yaml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "server/**/*.js"
      - "server/prisma/**"
      - "collector/**/*.js"

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Install server dependencies
        run: yarn install --frozen-lockfile
        working-directory: server

      - name: Install collector dependencies
        run: yarn install --frozen-lockfile
        working-directory: collector
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          SHARP_IGNORE_GLOBAL_LIBVIPS: "true"

      - name: Setup environment and Prisma
        run: yarn setup:envs && yarn prisma:setup

      - name: Run test suites
        run: yarn test

      - name: Fail job on error
        if: failure()
        run: exit 1
